# Minimal starter values for kube-prometheus-stack.
# Adjust storage, ingress, and retention for production.
#
# Security: keep Prometheus/Grafana as ClusterIP. Expose only via
# authenticated Ingress, VPN, or `kubectl port-forward` — not NodePort
# on every node IP. If you must use NodePort temporarily, firewall the
# ports to admin CIDRs only and rotate Grafana admin credentials.

prometheus:
  prometheusSpec:
    retention: 15d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    nodeSelector:
      observability: "true"
  service:
    type: ClusterIP

grafana:
  enabled: true
  nodeSelector:
    observability: "true"
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  # Folder per dashboard service via annotation grafana_folder on each CM.
  # Do not set defaultFolderName with folderAnnotation: sidecar nests
  # annotated paths under defaultFolderName (Kubernetes/Observability).
  # Chart sample CMs: annotate grafana_folder=Kubernetes after install
  # (or re-annotate after helm recreates them). Morning CMs set the
  # annotation in grafana/configmaps/.
  sidecar:
    dashboards:
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true

# Prefer standalone DaemonSet under exporters/node-exporter (helm chart
# upgrade on this cluster fails on defaultRules schema mismatch).
prometheus-node-exporter:
  enabled: false

nodeExporter:
  enabled: false

# Disable control-plane scrape jobs that are not exposed
# in this environment to avoid noisy default alerts.
kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeControllerManager:
  enabled: false

kubeProxy:
  enabled: false

defaultRules:
  rules:
    etcd: false

# Keep Watchdog enabled and route it through the default receiver
# so the alerting pipeline heartbeat can be monitored.
alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "cluster", "service"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: default
      routes:
        - matchers:
            - alertname="Watchdog"
          receiver: default
          continue: false
    receivers:
      - name: default
      # Keep this receiver for compatibility with chart-generated routes.
      - name: "null"
