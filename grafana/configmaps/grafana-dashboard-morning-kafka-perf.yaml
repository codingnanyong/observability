          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "count(kube_pod_status_ready{namespace=\"kafka\",pod=~\"kafka-connect-connect-.*\",condition=\"true\"}==1) or vector(0)",
              "refId": "A",
              "instant": true,
              "range": false,
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
