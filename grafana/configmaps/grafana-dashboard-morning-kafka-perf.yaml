          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"kafka\",pod=~\"kafka-connect-.*\"}[1h])) or vector(0)",
