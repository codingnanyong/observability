            "w": 24,
            "x": 0,
            "y": 17
          },
          "panels": []
        },
        {
          "id": 11,
          "type": "table",
          "title": "Brokers",
          "gridPos": {
            "h": 10,
            "w": 8,
            "x": 0,
            "y": 18
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (pod, phase) (kube_pod_status_phase{namespace=\"kafka\",pod=~\"kafka-cluster-combined-.*\"} == 1)",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true
                },
                "renameByName": {
                  "pod": "Broker",
                  "phase": "Phase",
                  "Value": "V"
                },
                "indexByName": {
                  "Broker": 0,
                  "Phase": 1,
                  "V": 2
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Broker",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left"
              }
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          },
          "description": "kafka broker Pod phase."
        },
        {
          "id": 12,
