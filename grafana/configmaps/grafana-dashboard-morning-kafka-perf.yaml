          "type": "table",
          "title": "CTM · consumergroup lag",
          "gridPos": {
            "h": 10,
            "w": 8,
            "x": 16,
            "y": 18
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (consumergroup) (kafka_consumergroup_lag{consumergroup=~\"connect-ctm-sink-.*\"})",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true
                },
                "renameByName": {
                  "consumergroup": "Group",
                  "Value": "Lag"
                },
                "indexByName": {
                  "Group": 0,
                  "Lag": 1
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Lag",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left"
