              "legendFormat": "restarts 1h"
            },
            {
              "expr": "sum(kafka_connect_connector_task_status{status=\"FAILED\"}) or vector(0)",
              "refId": "B",
              "legendFormat": "tasks FAILED"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "spanNulls": true,
                "showPoints": "never"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Soft"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
