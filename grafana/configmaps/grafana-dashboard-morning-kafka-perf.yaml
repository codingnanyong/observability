            "text": {
              "titleSize": 13,
              "valueSize": 36
            }
          },
          "description": "Connect worker Ready 수. 경고 <1 · 정상 ≥2"
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Broken",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(kafka_connect_connector_running == bool 0) or vector(0)",
              "refId": "A",
              "instant": true,
              "range": false,
              "queryType": "instant"
