            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "text": {
              "titleSize": 13,
              "valueSize": 36
            }
          },
          "description": "Running이 아닌 connector 수. Soft ≥1 · Hard ≥2"
        },
