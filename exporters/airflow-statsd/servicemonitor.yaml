apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: airflow-statsd
  namespace: observability
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/name: airflow-statsd
spec:
  namespaceSelector:
    matchNames:
      - airflow
  selector:
    matchLabels:
      component: statsd
      release: airflow
      tier: airflow
  endpoints:
    - port: statsd-scrape
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
      honorLabels: true
