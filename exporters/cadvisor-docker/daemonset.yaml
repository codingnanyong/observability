# Host Docker containers (non-Kubernetes). Cluster runtime is containerd.
#
# Security notes:
# - Privileged + Docker socket is high risk; pin to observability-labeled nodes
#   and firewall host port 9198 to Prometheus scrape CIDRs only.
# - Docker socket is mounted read-only (metrics only).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cadvisor-docker
  namespace: observability
  labels:
    app.kubernetes.io/name: cadvisor-docker
    app.kubernetes.io/part-of: observability
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cadvisor-docker
  namespace: observability
  labels:
    app.kubernetes.io/name: cadvisor-docker
    app.kubernetes.io/part-of: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cadvisor-docker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cadvisor-docker
        app.kubernetes.io/part-of: observability
    spec:
      serviceAccountName: cadvisor-docker
      automountServiceAccountToken: false
      hostNetwork: true
      hostPID: true
      nodeSelector:
        observability: "true"
      tolerations:
        - operator: Exists
      initContainers:
        - name: sysctl-inotify
          image: busybox:1.36
          command:
            - sh
            - -c
            - sysctl -w fs.inotify.max_user_instances=8192 || true; sysctl -w fs.inotify.max_user_watches=1048576 || true
          securityContext:
            privileged: true
      containers:
        - name: cadvisor
          image: gcr.io/cadvisor/cadvisor:v0.47.2
          imagePullPolicy: IfNotPresent
          args:
            - --port=9198
            - --docker_only=true
            - --housekeeping_interval=30s
            - --docker=unix:///var/run/docker.sock
            - --store_container_labels=false
            - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service,com.docker.compose.container-number
            - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,resctrl,advtcp
            - --event_storage_event_limit=default=0
            - --event_storage_age_limit=default=0
          ports:
            - name: metrics
              containerPort: 9198
              # hostNetwork already binds this on the node; keep hostPort for clarity.
              # Firewall 9198 to Prometheus scrape sources only.
              hostPort: 9198
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: rootfs
              mountPath: /rootfs
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: docker
              mountPath: /var/lib/docker
              readOnly: true
            - name: docker-sock
              mountPath: /var/run/docker.sock
              readOnly: true
            - name: disk
              mountPath: /dev/disk
              readOnly: true
      volumes:
        - name: rootfs
          hostPath:
            path: /
        - name: sys
          hostPath:
            path: /sys
        - name: docker
          hostPath:
            path: /var/lib/docker
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: disk
          hostPath:
            path: /dev/disk
---
apiVersion: v1
kind: Service
metadata:
  name: cadvisor-docker
  namespace: observability
  labels:
    app.kubernetes.io/name: cadvisor-docker
    app.kubernetes.io/part-of: observability
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9198
      targetPort: metrics
  selector:
    app.kubernetes.io/name: cadvisor-docker
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cadvisor-docker
  namespace: observability
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: cadvisor-docker
    app.kubernetes.io/part-of: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cadvisor-docker
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 15s
      path: /metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: instance
        - targetLabel: job
          replacement: cadvisor-docker
